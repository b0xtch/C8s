# Profile: c8s-pod
#
# Measured guest image for a pod CVM: one worker pod, one confidential VM,
# one tenant. It carries the c8s binary (staged by ../build) and two units:
# one copies this boot's launch files off the opkeydata volume, the other
# runs the agent that authenticates them, measures them and serves the
# attested API. There is no attestation daemon and no container runtime on
# the host's side of anything: the host has no control channel into this
# guest. See docs/pod-cvm.md.

[Content]
Packages=
    # The guest clock starts from a host-supplied value, and tokens and
    # certificate windows tolerate only a few minutes of skew.
    systemd-timesyncd
