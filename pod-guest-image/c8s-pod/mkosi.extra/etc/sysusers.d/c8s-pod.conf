# The unprivileged account tenant commands run as. It owns nothing the agent
# relies on and belongs to no other group.
#
# The group line must come first: sysusers does not create a group for a user
# declared with an explicit uid:gid, and skips the user when it is missing.
g workload 2000
u workload 2000:2000 "c8s pod workload" /home/workload /bin/bash
