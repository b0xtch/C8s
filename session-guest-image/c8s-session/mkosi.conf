# Profile: c8s-session
#
# Measured guest image for a confidential session: one confidential VM for
# one session. It carries the c8s binary (staged by ../build) and three units:
# one copies this boot's launch files off the opkeydata volume, one loads the
# inbound packet filter, and one runs the agent that authenticates the launch
# files, measures them and serves the attested API. The agent starts the
# sandbox image its bind names with crun. There is no attestation daemon, and
# nothing in the guest takes orders from the host: the host has no control
# channel into this guest. See docs/sessions.md.

# There is no time daemon. The guest's wall clock starts from the host's and
# runs on the TSC from there: NTP through the host's network would be the
# host's word again, and its client holds a UDP socket open to any sender in
# the guest's network namespace, the sandbox included.

[Content]
# no-kvmclock: the kernel never registers the clock the host feeds through a
# shared page, whatever the host advertises. The agent counts a guest's
# age limit on the TSC, which a confidential guest keeps itself.
#
# swiotlb=16384: the bounce buffer every virtio transfer goes through starts
# at 32 MiB (2 KiB slabs) and grows when a transfer finds it full
# (CONFIG_SWIOTLB_DYNAMIC). The kernel's own choice for a confidential guest
# is 6% of memory up to 1 GiB, made shared page by page at boot: seconds of
# boot and a gigabyte of the host's memory for each idle guest. 32768, the
# kernel's default for other machines, would read as no choice at all and
# get the 6%.
KernelCommandLine=no-kvmclock swiotlb=16384
# The firmware starts the kernel image itself: the UKI is the boot
# partition's fallback application, with no boot loader before it.
# systemd-boot would wait for a key nobody can press, be one more measured
# program, and read a configuration file nothing measures.
Bootloader=uki
Packages=
    # Runs the bind's OCI sandbox, in a user namespace.
    crun
    # Loads the inbound filter: only the agent's port is reachable.
    nftables
