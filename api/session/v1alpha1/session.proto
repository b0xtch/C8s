syntax = "proto3";

// The session API of the c8s daemon, as far as it is built. The design is
// docs/session-api.md: a call it names that is missing here is not built yet.
//
// The daemon runs on the host, outside the trust boundary. Nothing in a
// request or an answer is secret, and a caller acts on evidence it has
// verified, never on the daemon's word.
package c8s.session.v1alpha1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/confidential-dot-ai/c8s/api/session/v1alpha1;sessionv1alpha1";

service Sessions {
  // Claim reserves a ready TD of a pool for a session, in the daemon's own
  // record. The guest is asked nothing: it learns of the claim from the bind.
  rpc Claim(ClaimRequest) returns (Claimed);
  // Bind hands a claimed TD its bind and returns the guest's receipt for it.
  // The guest raises its fence as the bind arrives: no connection opened to
  // it before survives. The first message carries the bind, and may carry
  // the session's first command, sealed for the guest; a command may also
  // come alone in the next message. The first answer is the receipt. If the
  // guest took a command, a second answer follows with its sealed result. A
  // call whose bind came with no command ends once its caller has closed its
  // side, and one repeated because its answer was lost sends the same
  // command with the bind: the guest answers both as it answered the first.
  rpc Bind(stream BindRequest) returns (stream Bound);
  // Connect carries bytes to and from the TLS port of a bound TD, and
  // terminates nothing: the caller's TLS session ends in the guest.
  rpc Connect(stream Bytes) returns (stream Bytes);
  // Destroy ends a session's TD. It needs nothing from the guest.
  rpc Destroy(DestroyRequest) returns (Session);
  // GetEvidence returns what a TD's guest serves to anyone: its certificate,
  // its documents and its events.
  rpc GetEvidence(EvidenceRequest) returns (Evidence);
}

message ClaimRequest {
  // A repeat with the same id returns the first answer and changes nothing.
  string request_id = 1;
  string pool = 2;
  // The session's name, an RFC 1123 label. One TD serves it at a time.
  string session = 3;
  // How long to wait for a ready TD when the pool has none.
  google.protobuf.Duration wait = 4;
  // Placement arrives with a second host.
  reserved 5;
}

message Claimed {
  string td = 1;
  string host = 2;
  Evidence evidence = 3;
  // The claim lapses after this, and the TD returns to its pool.
  google.protobuf.Timestamp bind_by = 4;
}

message BindRequest {
  string request_id = 1;
  string td = 2;
  // c8s-bind/v1, canonical JSON, and its signature.
  bytes bind = 3;
  bytes signature = 4;
  // Disks and layers arrive with the disk slots.
  reserved 5, 6;
  // The session's first command, sealed to the guest's one-time KEM key
  // under the bind: with the bind, or alone in the next message of the call.
  // The daemon carries it unread.
  bytes command = 7;
}

message Bound {
  // The evidence now includes the bind.
  Evidence evidence = 1;
  // The guest's receipt for the bind (c8s-bind-receipt/v1), as the guest
  // sent it: signed by its one-time key over the bind's nonce. The quote
  // over the same nonce is in the evidence if the guest had it by then, and
  // in what GetEvidence returns once it has.
  bytes receipt = 2;
  // In a later message than the receipt: the first command's output and
  // status, sealed back to whoever sealed the command.
  bytes command_result = 3;
  // What became of a first command: taken, unopened or too_late, as the
  // guest says. With the receipt for a command that came with the bind, and
  // in a message of its own for one that came after. A result follows only
  // what was taken.
  string command = 4;
}

// Evidence is what a guest says of itself, relayed unread. Each part is
// checked by whoever acts on it.
message Evidence {
  // The guest's serving certificate, DER. Its evidence binds the instance key.
  bytes certificate = 1;
  bytes launch_document = 2;
  bytes launch_signature = 3;
  // The runtime register's event log, as the digests the guest extended.
  repeated string events = 4;
  // When bound.
  bytes bind = 5;
  // Once bound: the platform's evidence over the bind's nonce, in the
  // guest's own encoding, from when the guest has taken it. Nothing here
  // has a guest take a quote.
  bytes quote = 6;
  // The vendor's documents as the guest's host last handed them in.
  bytes collateral = 7;
  // Release proofs arrive with the release log.
  reserved 8;
  bytes bind_signature = 9;
  // What the guest calls its state: ready, bound or running.
  string phase = 10;
  // Where the guest says the quote over its bind's nonce stands, once it
  // runs its sandbox: trying, taken or given_up.
  string bind_quote = 11;
  // Once bound: the last certificate the guest issued before its bind. Its
  // quote is of the guest while it was nobody's and binds the one-time key
  // the guest's receipt for the bind is signed under.
  bytes ready_certificate = 12;
}

message Bytes {
  // The caller's first frame names the TD and carries no data.
  string td = 1;
  // 0 is the guest's TLS port, and the only port there is so far.
  uint32 port = 2;
  bytes data = 3;
}

message DestroyRequest {
  string request_id = 1;
  string session = 2;
}

enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  // Claimed, with no bind taken yet.
  SESSION_STATE_NEW = 1;
  SESSION_STATE_LIVE = 2;
  SESSION_STATE_DESTROYED = 3;
}

message Session {
  string name = 1;
  string pool = 2;
  string td = 3;
  string host = 4;
  SessionState state = 5;
}

message EvidenceRequest {
  string td = 1;
}
