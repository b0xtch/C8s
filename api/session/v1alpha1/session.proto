syntax = "proto3";

// The session API of the c8s daemon, as far as it is built. The design is
// docs/session-api.md: a call it names that is missing here is not built yet.
//
// The daemon runs on the host, outside the trust boundary. Nothing in a
// request or an answer is secret, and a caller acts on evidence it has
// verified, never on the daemon's word.
package c8s.session.v1alpha1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/confidential-dot-ai/c8s/api/session/v1alpha1;sessionv1alpha1";

service Sessions {
  // Claim reserves a ready TD of a pool for a session, in the daemon's own
  // record. The guest is asked nothing: it learns of the claim from the bind.
  rpc Claim(ClaimRequest) returns (Claimed);
  // Bind hands a claimed TD its bind and returns the guest's receipt for it.
  // A bind that names no TD claims one: the ready TD of the instance key the
  // bind names, which no claim holds, for the bind's session and with no
  // grace. An orchestrator may send such a bind, and a binder its pool names,
  // under an authority the pool names for that binder. A TD that is claimed
  // or gone by then is answered as not ready, before anything reaches a
  // guest: FAILED_PRECONDITION with an ErrorInfo of reason TD_NOT_READY in
  // the domain sessions.c8s. Its sender signs a bind for another TD.
  //
  // The guest raises its fence as the bind arrives: no connection opened to
  // it before survives. The first message carries the bind, and may carry a
  // message sealed for the guest: the session's first command, credentials
  // its binder holds, or both. A sealed message may also come alone in the
  // next message. The first answer is the receipt. If the guest took a
  // sealed message, a second answer follows with its sealed answer. A call
  // whose bind came with no sealed message ends once its caller has closed
  // its side, and one repeated because its answer was lost sends the same
  // sealed message with the bind: the guest answers both as it answered the
  // first.
  rpc Bind(stream BindRequest) returns (stream Bound);
  // Connect carries bytes to and from the TLS port of a bound TD, and
  // terminates nothing: the caller's TLS session ends in the guest.
  rpc Connect(stream Bytes) returns (stream Bytes);
  // Destroy ends a session's TD. It needs nothing from the guest.
  rpc Destroy(DestroyRequest) returns (Session);
  // GetEvidence returns what a TD's guest serves to anyone: its certificate,
  // its documents and its events.
  rpc GetEvidence(EvidenceRequest) returns (Evidence);
  // WatchReady streams what each ready TD of a pool says of itself, as a
  // claim of it would be answered: the TDs ready now, then each as it becomes
  // ready or comes to serve another certificate, and each that leaves ready.
  // A binder judges them ahead of its claims, or signs a bind for one, which
  // claims it. A stream shows how fast a pool refills, so it is open only to
  // the binders the pool's configuration names.
  rpc WatchReady(WatchReadyRequest) returns (stream ReadyChange);
  // Watch streams what becomes of the host's TDs to an orchestrator: each TD
  // as it is now, then each as it changes. A TD that changed more than once
  // between two messages is shown as it is, so every session a host serves
  // is shown, also one that a binder's bind started with no claim.
  rpc Watch(WatchRequest) returns (stream Event);
}

message ClaimRequest {
  // A repeat with the same id returns the first answer and changes nothing.
  string request_id = 1;
  string pool = 2;
  // The session's name, an RFC 1123 label. One TD serves it at a time.
  string session = 3;
  // How long to wait for a ready TD when the pool has none.
  google.protobuf.Duration wait = 4;
  // Placement arrives with a second host.
  reserved 5;
}

message Claimed {
  string td = 1;
  string host = 2;
  Evidence evidence = 3;
  // The claim lapses after this, and the TD returns to its pool.
  google.protobuf.Timestamp bind_by = 4;
}

message BindRequest {
  string request_id = 1;
  // The claimed TD the bind is for. Empty in a bind that claims its TD.
  string td = 2;
  // c8s-bind/v1, canonical JSON, and its signature.
  bytes bind = 3;
  bytes signature = 4;
  // Disks and layers arrive with the disk slots.
  reserved 5, 6;
  // The session's first command and the credentials its binder holds,
  // sealed to the guest's one-time KEM key under the bind: with the bind, or
  // alone in the next message of the call. The daemon carries it unread.
  bytes sealed = 7;
}

message Bound {
  // The evidence now includes the bind. In a later message than the
  // receipt: the guest's evidence with the quote over the bind's nonce, once
  // the guest has taken it, or with its word that it gave up on one
  // (bind_quote).
  Evidence evidence = 1;
  // The guest's receipt for the bind (c8s-bind-receipt/v1), as the guest
  // sent it: signed by its one-time key over the bind's nonce. The quote
  // over the same nonce is in the evidence if the guest had it by then, and
  // follows in a later message of the call once it has.
  bytes receipt = 2;
  // In a later message than the receipt: what became of each part of the
  // sealed message, with the command's output and status, sealed back to
  // whoever sealed the message.
  bytes sealed_answer = 3;
  // What became of a sealed message: taken, unopened or too_late, as the
  // guest says. With the receipt for a message that came with the bind, and
  // in a message of its own for one that came after. An answer follows only
  // what was taken, and a binder relies on that answer alone.
  string sealed_status = 4;
  // With the receipt of a bind that claimed its TD: the TD, and its host.
  string td = 5;
  string host = 6;
}

// Evidence is what a guest says of itself, relayed unread. Each part is
// checked by whoever acts on it.
message Evidence {
  // The guest's serving certificate, DER. Its evidence binds the instance key.
  bytes certificate = 1;
  bytes launch_document = 2;
  bytes launch_signature = 3;
  // The runtime register's event log, as the digests the guest extended.
  repeated string events = 4;
  // When bound.
  bytes bind = 5;
  // Once bound: the platform's evidence over the bind's nonce, in the
  // guest's own encoding, from when the guest has taken it. Nothing here
  // has a guest take a quote.
  bytes quote = 6;
  // The vendor's documents as the guest's host last handed them in.
  bytes collateral = 7;
  // Release proofs arrive with the release log.
  reserved 8;
  bytes bind_signature = 9;
  // What the guest calls its state: ready, bound or running.
  string phase = 10;
  // Where the guest says the quote over its bind's nonce stands, once it
  // runs its sandbox: trying, taken or given_up.
  string bind_quote = 11;
  // Once bound: the last certificate the guest issued before its bind. Its
  // quote is of the guest while it was nobody's and binds the one-time key
  // the guest's receipt for the bind is signed under.
  bytes ready_certificate = 12;
}

message Bytes {
  // The caller's first frame names the TD and carries no data.
  string td = 1;
  // 0 is the guest's TLS port, and the only port there is so far.
  uint32 port = 2;
  bytes data = 3;
}

message DestroyRequest {
  string request_id = 1;
  string session = 2;
}

enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  // Claimed, with no bind taken yet.
  SESSION_STATE_NEW = 1;
  SESSION_STATE_LIVE = 2;
  SESSION_STATE_DESTROYED = 3;
}

message Session {
  string name = 1;
  string pool = 2;
  string td = 3;
  string host = 4;
  SessionState state = 5;
}

message EvidenceRequest {
  string td = 1;
}

message WatchReadyRequest {
  string pool = 1;
}

// ReadyChange is one change to a pool's ready TDs.
message ReadyChange {
  oneof change {
    // A TD that is ready, as a claim of it would be answered.
    Evidence ready = 1;
    // A TD that left ready, claimed, bound or ended, or that came to serve
    // another certificate. It is named by the SHA-256 of the certificate it
    // was last shown under, which is how a binder keeps its verdict on it.
    bytes left = 2;
  }
}

message WatchRequest {}

enum TDState {
  TD_STATE_UNSPECIFIED = 0;
  TD_STATE_BOOTING = 1;
  TD_STATE_READY = 2;
  TD_STATE_CLAIMED = 3;
  // Sent a bind whose answer is not known yet.
  TD_STATE_BOUND = 4;
  TD_STATE_RUNNING = 5;
  TD_STATE_ENDED = 6;
}

// Event is a TD as it is: when a watch begins, and after each change.
message Event {
  string td = 1;
  string pool = 2;
  string host = 3;
  TDState state = 4;
  // The session the TD serves or served, once it is claimed.
  string session = 5;
  // Why an ended TD ended.
  string reason = 6;
  // For a TD that a bind claimed: the key of the binder that sent it, as the
  // pool's configuration names it. Empty when an orchestrator sent it, and
  // for a TD claimed by Claim.
  string claimed_by = 7;
  google.protobuf.Timestamp at = 8;
}
